<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LNM Bytes – offline</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Inter,system-ui,sans-serif;background:#f8fafc;color:#0f172a;padding:24px;text-align:center}
  @media (prefers-color-scheme:dark){body{background:#0f172a;color:#f1f5f9}}
  main{max-width:320px}
  h1{font-size:20px;margin:0 0 8px}
  p{margin:0 0 20px;color:#64748b;font-size:14px;line-height:1.5}
  button{background:#4f46e5;color:#fff;border:0;border-radius:12px;padding:12px 20px;font-weight:700;font-size:14px;cursor:pointer}
</style>
</head>
<body>
<main>
  <h1>You are offline</h1>
  <p>LNM Bytes needs an internet connection to show menus and orders. Reconnect and try again.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
