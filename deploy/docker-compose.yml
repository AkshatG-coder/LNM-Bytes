# Run from the repo root:  docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
services:
  mongo:
    image: mongo:7
    restart: always
    volumes: [mongo_data:/data/db]
    # Not published to the host: only the backend can reach it.

  backend:
    build: { context: .., dockerfile: deploy/Dockerfile.backend }
    restart: always
    depends_on: [mongo]
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "8081"
      DB_CONNECTION_STRING: mongodb://mongo:27017
    # KAFKA_BROKER is left unset on purpose: the app uses its in-memory queue (one VM, one backend).

  user_web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        APP: User_page
        VITE_API_URL: ${API_URL}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_PEXELS_API_KEY: ${VITE_PEXELS_API_KEY:-}
    restart: always

  owner_web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        APP: Owner_page
        VITE_API_URL: ${API_URL}
    restart: always

  nginx:
    image: nginx:1.27-alpine
    restart: always
    depends_on: [backend, user_web, owner_web]
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro

  backup:
    image: mongo:7
    restart: always
    depends_on: [mongo]
    volumes: [./backups:/backups]
    entrypoint: ["/bin/sh","-c","while true; do mongodump --host mongo --archive=/backups/lnmbytes-$$(date +%F).gz --gzip; find /backups -name '*.gz' -mtime +14 -delete; sleep 86400; done"]

volumes:
  mongo_data:
